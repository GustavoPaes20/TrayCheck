  /checks/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CheckId'
      - name: itemId
        in: path
        required: true
        description: ID do item da checagem.
        schema:
          type: string
        example: '7'
    patch:
      tags: [Checagens]
      summary: Confirma, pula, marca divergente ou volta o item para pendente (RF06)
      description: |
        **Perfis permitidos:** Enfermeiro(a) Instrumentador(a); Circulante (UC06 e UC07). O Administrador apenas consulta.

        Registra a marcação do item, por voz ou toque (RNF02). Comandos de voz equivalentes: "confirmar" e "pular".

        Estados gravados (tabela `item_checagem`): `confirmado`, `pulado`, `divergente` e `pendente`.
        - **Pulado** não é divergência: não gera registro em `divergencia`, mas aparece no relatório como não conferido (UC07, RNF06).
        - **RN07:** se `status = confirmado` e `foundQuantity` for diferente da esperada, o servidor grava o item como `divergente` e cria a divergência automaticamente: `faltante` quando a quantidade for menor e `excedente` quando for maior.
        - **RN04:** `status = divergente` cria a divergência (`faltante`, automática) e ela entra no relatório.
        - Voltar para `pendente` limpa quantidade, método e horário e remove a divergência automática.
        - Um item já marcado pode ser corrigido enquanto a checagem estiver `em_andamento`. Depois de finalizada ou cancelada a checagem é imutável (RN03, 409).
      operationId: updateCheckItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckItemUpdate'
            examples:
              confirmarPorVoz:
                summary: Confirmar por voz
                value:
                  status: confirmado
                  foundQuantity: 2
                  method: voz
                  transcript: confirmar pinça kelly
              pularPorToque:
                summary: Pular por toque
                value:
                  status: pulado
                  method: toque
              divergente:
                summary: Item faltante
                value:
                  status: divergente
                  foundQuantity: 1
                  method: toque
                  notes: Apenas uma unidade na bandeja.
              excedenteRN07:
                summary: Confirmado com quantidade maior (RN07 → excedente)
                value:
                  status: confirmado
                  foundQuantity: 5
                  method: toque
      responses:
        '200':
          description: Item atualizado. Retorna a checagem completa com o progresso recalculado (o item pode ter sido convertido em `divergente` pela RN07).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
