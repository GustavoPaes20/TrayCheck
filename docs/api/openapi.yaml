openapi: 3.0.3

info:
  title: TrayCheck API
  version: 1.0.0
  description: |
    API REST do **TrayCheck**, sistema de checklist de instrumentos cirúrgicos pré-cirurgia com assistência de voz (Projeto Integrador, FAMETRO, 2026).

    Contrato de API (IC-16), revisão 1.0, alinhado à ERS v2.2, à RTM v1.0 e às migrações `db/migrations` V001–V005. O frontend (`src/frontend/services/api.ts`) usa 22 destas rotas; as demais cobrem RF02 a RF09.

    ### Requisitos atendidos
    - **RF01** autenticação e acesso por perfil
    - **RF02** instrumentais e kits
    - **RF03** procedimentos
    - **RF04** checklist padrão por procedimento
    - **RF05 a RF07** iniciar checagem, confirmar/pular itens e finalizar
    - **RF08** histórico de checagens e relatórios
    - **RF09** divergências (faltantes e excedentes)
    - **RF10** relatório de conferência
    - Rotas de apoio ao frontend: dashboard, estoque e perfil

    ### Regras de negócio
    - **RN01** só finaliza sem itens `pendente` (409).
    - **RN02** só administrador cadastra procedimentos e vincula checklists (403).
    - **RN03** checagem finalizada ou cancelada é imutável (409).
    - **RN04** item divergente gera divergência e entra no relatório.
    - **RN05** cada perfil executa só as ações do seu perfil (403).
    - **RN06** um checklist ativo por procedimento; checklist já usado exige nova versão (409).
    - **RN07** confirmar com quantidade diferente da esperada vira divergência (menor = faltante, maior = excedente).
    - **RN08** checagens não são excluídas; as em andamento podem ser canceladas.

    ### Perfis
    O campo `role` usa os valores do frontend. Equivalência com a tabela `perfil`: `admin` = `admin`, `nurse` = `enfermeiro` (Enfermeiro(a) Instrumentador(a)), `technician` = `circulante`.

    | Área | Administrador | Enfermeiro(a) | Circulante |
    | --- | --- | --- | --- |
    | Usuários | gerencia | não | não |
    | Instrumentais e kits (UC02) | cadastra | cadastra | consulta |
    | Procedimentos e checklists padrão (UC03, UC04) | cadastra | consulta | consulta |
    | Iniciar e cancelar checagem (UC05) | consulta | executa | consulta |
    | Confirmar, pular, divergência, finalizar (UC06 a UC09) | consulta | executa | executa |
    | Relatórios (UC10) | consulta | consulta | consulta |
    | Estoque | gerencia | consulta | consulta |

    Cada operação traz o campo `x-roles` com os perfis permitidos.

    ### Estados da checagem e do relatório
    | Banco (`item_checagem.status`) | Item no relatório | Observação |
    | --- | --- | --- |
    | `pendente` | `pending` | não existe em relatório finalizado |
    | `confirmado` | `confirmed` | |
    | `pulado` | `skipped` | não é divergência |
    | `divergente` | `missing` | gera registro em `divergencia` |

    ### Convenções
    - IDs são strings (o banco usa `INT UNSIGNED`).
    - Datas exibidas pela interface usam `dd/MM/yyyy` e horários `HH:mm:ss`, como no frontend. Os recursos novos usam ISO 8601.
    - Erros retornam o schema `Error` com `message` em português.
    - Campos sem tabela nas migrações V001–V005 estão marcados na descrição e dependem de uma migração V006.
  contact:
    name: Equipe TrayCheck — FAMETRO
    url: https://github.com/GustavoPaes20/TrayCheck
  license:
    name: Uso acadêmico — FAMETRO

    url: https://github.com/GustavoPaes20/TrayCheck
servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento local (valor de VITE_API_BASE_URL no frontend)

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Autenticação
    description: Login, logout e sessão atual (RF01)
  - name: Usuários
    description: Gestão de usuários pelo administrador (RF01, RN05)
  - name: Perfil
    description: Dados e preferências do usuário logado
  - name: Dashboard
    description: Resumo da tela inicial
  - name: Instrumentais
    description: Cadastro de instrumentais cirúrgicos (RF02)
  - name: Kits
    description: Cadastro de kits de instrumentais (RF02)
  - name: Procedimentos
    description: Cadastro de procedimentos/cirurgias (RF03, RN02)
  - name: Checklists padrão
    description: Vínculo de checklist padrão ao procedimento (RF04, RN02)
  - name: Checagens
    description: Execução da checagem, itens e divergências (RF05–RF09, RN01, RN03, RN04)
  - name: Relatórios
    description: Relatórios de conferência e histórico (RF08, RF10)
  - name: Estoque
    description: Controle de estoque de instrumentais e materiais

paths:
  # ───────────────────────────── Autenticação ─────────────────────────────
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o usuário por e-mail e senha
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana.silva@hospitalcentral.br
              password: senha123
      responses:
        '200':
          description: Autenticado. Retorna o usuário e, opcionalmente, um token bearer.
          headers:
            Set-Cookie:
              description: Cookie de sessão HttpOnly, quando o backend usa sessão por cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou senha inválidos, ou usuário inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: E-mail ou senha inválidos.
                code: CREDENCIAIS_INVALIDAS
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: []
      description: |
        **Perfis permitidos:** público (sem autenticação).
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      operationId: logout
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário da sessão atual
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Usuários ─────────────────────────────
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
  /users:
    get:
      tags: [Usuários]
      summary: Lista usuários
      operationId: listUsers
      parameters:
        - name: role
          in: query
          description: Filtra por perfil.
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          description: Filtra por situação.
          schema:
            type: string
            enum: [active, inactive]
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Lista de usuários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.
    post:
      tags: [Usuários]
      summary: Cria usuário
      description: |
        **Perfis permitidos:** Administrador.

        A senha inicial é definida pelo backend e enviada ao usuário; o frontend nunca envia hash de senha.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Já existe usuário com este e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Já existe um usuário com este e-mail.
                code: EMAIL_DUPLICADO
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin]
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Detalha um usuário
      operationId: getUser
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.
    put:
      tags: [Usuários]
      summary: Atualiza um usuário
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.
  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa um usuário
      description: |
        **Perfis permitidos:** Administrador.

        Usuários não são excluídos fisicamente, para preservar o histórico de checagens (RN03).
      operationId: setUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusInput'
            example:
              status: inactive
      responses:
        '200':
          description: Situação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Perfil ─────────────────────────────
      x-roles: [admin]
  /profile:
    get:
      tags: [Perfil]
      summary: Retorna o perfil do usuário logado
      operationId: getProfile
      responses:
        '200':
          description: Perfil do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
    patch:
      tags: [Perfil]
      summary: Atualiza nome e telefone do usuário logado
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
  /profile/notifications:
    get:
      tags: [Perfil]
      summary: Retorna as preferências de notificação
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Preferências atuais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.

        Sem tabela nas migrações V001–V005: as preferências exigem uma migração (V006). Até lá, ficam em memória/demonstração.
    put:
      tags: [Perfil]
      summary: Salva as preferências de notificação
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferências salvas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
  /profile/password:
    put:
      tags: [Perfil]
      summary: Altera a senha do usuário logado
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Senha alterada.
        '400':
          description: Senha atual incorreta ou nova senha fora da política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: A senha atual está incorreta.
                code: SENHA_ATUAL_INCORRETA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Dashboard ─────────────────────────────
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Resumo da tela inicial
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.

        Totais de cirurgias e estoque e a programação do dia. Os totais vêm de agregações (procedimentos, checagens e `estoque_item.situacao`). `schedule` e `surgeryTrend` **não têm tabela** nas migrações V001–V005: até existir uma migração (V006), o backend responde com dados de demonstração.
      operationId: getDashboard
      responses:
        '200':
          description: Resumo do dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Instrumentais (RF02) ─────────────────────────────
      x-roles: [admin, nurse, technician]
  /instruments:
    get:
      tags: [Instrumentais]
      summary: Lista instrumentais cadastrados
      operationId: listInstruments
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/InstrumentCategory'
        - name: active
          in: query
          description: Filtra por ativos/inativos. Sem o parâmetro, retorna todos.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Lista de instrumentais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
    post:
      tags: [Instrumentais]
      summary: Cadastra instrumental
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentInput'
      responses:
        '201':
          description: Instrumental criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin, nurse]
      description: |
        **Perfis permitidos:** Administrador; Enfermeiro(a) Instrumentador(a).

        RN05: o Circulante não cadastra instrumentais nem kits (403).
  /instruments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Instrumentais]
      summary: Detalha um instrumental
      operationId: getInstrument
      responses:
        '200':
          description: Instrumental encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
    put:
      tags: [Instrumentais]
      summary: Atualiza um instrumental
      operationId: updateInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentInput'
      responses:
        '200':
          description: Instrumental atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse]
      description: |
        **Perfis permitidos:** Administrador; Enfermeiro(a) Instrumentador(a).

        RN05: o Circulante não cadastra instrumentais nem kits (403).
    delete:
      tags: [Instrumentais]
      summary: Inativa um instrumental
      description: |
        **Perfis permitidos:** Administrador; Enfermeiro(a) Instrumentador(a).

        RN05: o Circulante não cadastra instrumentais nem kits (403).

        Exclusão lógica (`active = false`), pois o instrumental pode estar referenciado em kits, checklists e checagens.
      operationId: deleteInstrument
      responses:
        '204':
          description: Instrumental inativado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Kits (RF02) ─────────────────────────────
      x-roles: [admin, nurse]
  /kits:
    get:
      tags: [Kits]
      summary: Lista kits
      operationId: listKits
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Lista de kits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
    post:
      tags: [Kits]
      summary: Cadastra kit com seus instrumentais
      operationId: createKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitInput'
      responses:
        '201':
          description: Kit criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin, nurse]
      description: |
        **Perfis permitidos:** Administrador; Enfermeiro(a) Instrumentador(a).

        RN05: o Circulante não cadastra instrumentais nem kits (403).
  /kits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Kits]
      summary: Detalha um kit
      operationId: getKit
      responses:
        '200':
          description: Kit encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse, technician]
      description: |
        **Perfis permitidos:** qualquer usuário autenticado.
    put:
      tags: [Kits]
      summary: Atualiza um kit e substitui sua lista de itens
      operationId: updateKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitInput'
      responses:
        '200':
          description: Kit atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin, nurse]
      description: |
        **Perfis permitidos:** Administrador; Enfermeiro(a) Instrumentador(a).

        RN05: o Circulante não cadastra instrumentais nem kits (403).
    delete:
      tags: [Kits]
      summary: Inativa um kit
      operationId: deleteKit
      responses:
        '204':
          description: Kit inativado.
        '401':
