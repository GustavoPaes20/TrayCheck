        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.

        No banco, `estoque_item` referencia um instrumental (nome, unidade e categoria ficam em `instrumental`). Sem `instrumentId`, o backend cadastra o instrumental e cria o saldo na mesma transação; com `instrumentId`, usa o instrumental existente. Cada instrumental tem **um** saldo (409 se já existir).
  /stock/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Estoque]
      summary: Atualiza item de estoque
      operationId: updateStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '200':
          description: Item atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.
    delete:
      tags: [Estoque]
      summary: Exclui item de estoque
      operationId: deleteStockItem
      responses:
        '204':
          description: Item excluído.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Item possui movimentações e não pode ser excluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin]
      description: |
        **Perfis permitidos:** Administrador.
  /stock/{id}/adjustments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Estoque]
      summary: Registra entrada ou saída de estoque
      description: |
        **Perfis permitidos:** Administrador.

        `delta` positivo para entrada e negativo para saída; diferente de zero. Cada ajuste grava uma movimentação imutável (`estoque_movimentacao`) e atualiza o saldo; o saldo nunca fica negativo (400).
      operationId: adjustStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustment'
            example:
              delta: -2
              reason: Separado para cirurgia de joelho, sala 3.
      responses:
        '200':
          description: Estoque atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          description: Delta igual a zero ou estoque insuficiente para a saída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Estoque insuficiente para esta movimentação.
                code: ESTOQUE_INSUFICIENTE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

      x-roles: [admin]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token retornado em `accessToken` no login. O frontend o mantém apenas em memória.
    cookieAuth:
      type: apiKey
      in: cookie
      name: traycheck_session
      description: Cookie de sessão HttpOnly, alternativa ao token bearer.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        type: string
      example: '1'
    SurgeryId:
      name: id
      in: path
      required: true
      description: Identificador do procedimento (código legível, ex. `joelho`, ou ID numérico).
      schema:
        type: string
      example: joelho
    CheckId:
      name: id
      in: path
      required: true
      description: Identificador da checagem.
      schema:
        type: string
      example: '42'
    Search:
      name: q
      in: query
      required: false
      description: Busca textual por nome.
      schema:
        type: string
        maxLength: 120
    From:
      name: from
      in: query
      required: false
      description: Data inicial (inclusive).
      schema:
        type: string
        format: date
      example: '2026-11-01'
    To:
      name: to
      in: query
      required: false
      description: Data final (inclusive).
      schema:
        type: string
        format: date
      example: '2026-11-30'

  responses:
    BadRequest:
      description: Requisição inválida (campos ausentes, formato ou valores fora do permitido).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Dados inválidos.
            code: VALIDACAO
            details:
              fields:
                email: Informe um e-mail válido.
    Unauthorized:
      description: Não autenticado ou sessão expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Sessão expirada. Faça login novamente.
            code: NAO_AUTENTICADO
    Forbidden:
      description: O perfil do usuário não permite esta ação (RN02, RN05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Seu perfil não tem permissão para esta ação.
            code: SEM_PERMISSAO
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Registro não encontrado.
            code: NAO_ENCONTRADO
    Conflict:
      description: Conflito com um registro existente (código, nome ou e-mail duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Já existe um registro com este código.
            code: DUPLICADO
    CheckClosed:
      description: A checagem já foi finalizada ou cancelada e não aceita alterações (RN03).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Esta checagem já foi finalizada e não pode ser alterada.
            code: CHECAGEM_ENCERRADA
    InternalError:
      description: Erro interno no servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Erro interno. Tente novamente em instantes.
            code: ERRO_INTERNO

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Mensagem legível, exibida pelo frontend.
        code:
          type: string
          description: Código estável do erro, para tratamento no cliente.
        details:
          type: object
          additionalProperties: true
          description: Informações extras (ex. erros por campo).

    # ── Autenticação e usuários ──
    UserRole:
      type: string
      enum: [admin, nurse, technician]
      description: 'admin = Administrador; nurse = Enf. Instrumentador(a); technician = Circulante.'
      example: nurse

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 160
        password:
          type: string
          format: password
          minLength: 6

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
          description: Token bearer opcional (omitido quando a sessão é por cookie).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthUser:
      type: object
      required: [id, name, email, role, shift, initials, hospital, phone, joinedAt]
      properties:
        id:
          type: string
          example: u1
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana.silva@hospitalcentral.br
        role:
          $ref: '#/components/schemas/UserRole'
        shift:
          type: string
          example: Turno A (07:00–19:00)
          description: Turno (`usuario.turno`).
        initials:
          type: string
          example: AS
        hospital:
          type: string
          example: Hospital Central
          description: Sem coluna no banco; valor de configuração do backend.
        phone:
          type: string
          example: (92) 99999-0000
          description: Telefone (`usuario.telefone`).
        crm:
          type: string
          description: 'Registro profissional (`usuario.registro_profissional`, ex.: COREN).'
          example: COREN-AM 123456
        joinedAt:
          type: string
          description: Data de cadastro (`usuario.criado_em`), formato dd/MM/yyyy.
          example: 15/03/2024

    AppUser:
      type: object
      required: [id, name, email, role, shift, status, lastActive, initials]
      properties:
        id:
          type: string
          example: u2
        name:
          type: string
          example: Rafael Lima
        email:
          type: string
          format: email
          example: rafael.lima@hospitalcentral.br
        role:
          $ref: '#/components/schemas/UserRole'
        shift:
          type: string
          example: Turno B (19:00–07:00)
        status:
          type: string
          enum: [active, inactive]
        lastActive:
          type: string
          description: Último acesso, em texto para exibição.
          example: Hoje, 08:42
        initials:
          type: string
          example: RL

    UserInput:
      type: object
      required: [name, email, role, shift]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Rafael Lima
        email:
          type: string
          format: email
          maxLength: 160
          example: rafael.lima@hospitalcentral.br
        role:
          $ref: '#/components/schemas/UserRole'
        shift:
          type: string
          maxLength: 60
          example: Turno B (19:00–07:00)

    UserStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    ProfileInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Ana Silva
        phone:
          type: string
          maxLength: 30
          example: (92) 99999-0000

    NotificationPreferences:
      type: object
      required: [stockAlert, surgeryReminder, voiceChecklist, weeklyReport]
      properties:
        stockAlert:
          type: boolean
          example: true
        surgeryReminder:
          type: boolean
          example: true
        voiceChecklist:
          type: boolean
          example: true
        weeklyReport:
          type: boolean
          example: false

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    # ── Dashboard ──
    DashboardSummary:
      type: object
      required: [totalSurgeries, readyKits, criticalStockItems, lowStockItems, stockItemCount, schedule]
      properties:
        totalSurgeries:
          type: integer
          minimum: 0
          example: 8
        readyKits:
          type: integer
          minimum: 0
          example: 5
        criticalStockItems:
          type: integer
          minimum: 0
          example: 2
        lowStockItems:
          type: integer
          minimum: 0
          example: 4
        stockItemCount:
          type: integer
          minimum: 0
          example: 36
        surgeryTrend:
          type: object
          required: [text, positive]
          properties:
            text:
              type: string
              example: +2 em relação a ontem
            positive:
              type: boolean
              example: true
          description: Sem tabela nas migrações V001–V005; dados de demonstração até a V006.
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleEntry'

          description: Sem tabela nas migrações V001–V005 (sem tabela de agenda); dados de demonstração até a V006.
    ScheduleEntry:
      type: object
      required: [id, surgeryId, time, surgery, room, surgeon, status]
      properties:
        id:
          type: string
          example: s1
        surgeryId:
          type: string
          example: joelho
        time:
          type: string
          example: '08:00'
        surgery:
          type: string
          example: Artroplastia de Joelho
        room:
          type: string
          example: Sala 3
        surgeon:
          type: string
          example: Dr. Carlos Mendes
        status:
          type: string
          enum: [em-andamento, aguardando, concluida]
    InstrumentCategory:
      type: string
      enum: [EPI, Instrumental, Descartável, Anestesia, Implante]
      example: Instrumental

    Instrument:
      type: object
      required: [id, code, name, category, unit, critical, active]
      properties:
        id:
          type: string
          example: '12'
        code:
          type: string
          example: INS-PINCA-KELLY
        name:
          type: string
          example: Pinça Kelly reta 14cm
        category:
          $ref: '#/components/schemas/InstrumentCategory'
        unit:
          type: string
          example: unid
        critical:
          type: boolean
          description: Item cuja falta impede a cirurgia.
          example: true
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    InstrumentInput:
      type: object
      required: [code, name, category]
      properties:
        code:
          type: string
          maxLength: 40
          example: INS-PINCA-KELLY
        name:
          type: string
          maxLength: 120
          example: Pinça Kelly reta 14cm
        category:
          $ref: '#/components/schemas/InstrumentCategory'
        unit:
          type: string
          maxLength: 20
          default: unid
        critical:
          type: boolean
          default: false
        active:
          type: boolean
          default: true

    KitItem:
      type: object
      required: [instrumentId, quantity]
      properties:
        instrumentId:
          type: string
          example: '12'
        instrumentName:
          type: string
          readOnly: true
          example: Pinça Kelly reta 14cm
        quantity:
          type: integer
          minimum: 1
          example: 4

    Kit:
      type: object
      required: [id, code, name, active, items]
      properties:
        id:
          type: string
          example: '3'
        code:
          type: string
          example: KIT-ORTO-BASICO
        name:
          type: string
          example: Kit Ortopedia Básico
        description:
          type: string
          example: Instrumental básico para cirurgias ortopédicas.
        active:
          type: boolean
          example: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/KitItem'

    KitInput:
      type: object
      required: [code, name, items]
      properties:
        code:
          type: string
          maxLength: 40
          example: KIT-ORTO-BASICO
        name:
          type: string
          maxLength: 120
          example: Kit Ortopedia Básico
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
          default: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/KitItem'

    Surgery:
      type: object
      description: |
        Procedimento cirúrgico. Os campos `color`, `bgColor`, `scheduledToday`, `room` e
        `time` são de apresentação, usados pela tela de seleção de cirurgia do frontend.
      required: [id, name, specialty, duration]
      properties:
        id:
          type: string
          example: joelho
        code:
          type: string
          example: joelho
        name:
          type: string
          example: Artroplastia de Joelho
        specialty:
          type: string
          example: Ortopedia
        description:
          type: string
          example: Substituição total da articulação do joelho.
        duration:
          type: string
          description: Duração estimada.
          example: 2–3h
        active:
          type: boolean
          example: true
        activeChecklistVersion:
          type: string
          nullable: true
          example: '1.0'
        color:
          type: string
          example: '#2563eb'
          description: 'Apresentação; sem coluna no banco, definido pelo backend (ex.: por especialidade).'
        bgColor:
          type: string
          example: '#eff6ff'
          description: 'Apresentação; sem coluna no banco, definido pelo backend (ex.: por especialidade).'
        scheduledToday:
          type: integer
          minimum: 0
          example: 2
          description: Sem tabela nas migrações V001–V005 (sem tabela de agenda); dados de demonstração até a V006.
        room:
          type: string
          example: Sala 3
          description: Sem tabela nas migrações V001–V005 (sem tabela de agenda); dados de demonstração até a V006.
        time:
          type: string
          example: '08:00'

          description: Sem tabela nas migrações V001–V005 (sem tabela de agenda); dados de demonstração até a V006.
    SurgeryInput:
      type: object
      required: [code, name, specialty]
      properties:
        code:
          type: string
          maxLength: 40
          pattern: '^[a-z0-9-]+$'
          example: joelho
        name:
          type: string
          maxLength: 120
          example: Artroplastia de Joelho
        specialty:
          type: string
          maxLength: 80
          example: Ortopedia
        description:
          type: string
          maxLength: 500
        duration:
          type: string
          maxLength: 20
          example: 2–3h
        active:
          type: boolean
          default: true

    EquipmentItem:
      type: object
      required: [id, name, quantity, unit, category, critical]
      properties:
        id:
          type: string
          example: '12'
        name:
          type: string
          example: Pinça Kelly reta 14cm
        quantity:
          type: integer
          minimum: 1
          example: 4
        unit:
          type: string
          example: unid
        category:
          $ref: '#/components/schemas/InstrumentCategory'
        critical:
          type: boolean
          example: true

    # ── Checklist padrão (RF04) ──
    StandardChecklistItem:
      type: object
      required: [id, instrumentId, instrumentName, expectedQuantity, order]
      properties:
        id:
          type: string
          example: '31'
        instrumentId:
          type: string
          example: '12'
        instrumentName:
          type: string
          example: Pinça Kelly reta 14cm
        category:
          $ref: '#/components/schemas/InstrumentCategory'
        unit:
          type: string
          example: unid
        critical:
          type: boolean
          example: true
        expectedQuantity:
          type: integer
          minimum: 1
          example: 4
        order:
          type: integer
          minimum: 0
          description: Ordem de leitura na checagem por voz.
          example: 1

    StandardChecklist:
      type: object
      required: [id, surgeryId, version, active, createdAt, items]
      properties:
        id:
          type: string
          example: '5'
        surgeryId:
          type: string
          example: joelho
        version:
          type: string
          example: '1.0'
        active:
          type: boolean
          example: true
        createdBy:
          type: string
          example: Administrador
        createdAt:
          type: string
          format: date-time
          example: '2026-11-03T14:20:00-04:00'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StandardChecklistItem'

    StandardChecklistInput:
      type: object
      required: [version, items]
      properties:
        version:
          type: string
          maxLength: 20
          example: '1.1'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [instrumentId, expectedQuantity]
            properties:
              instrumentId:
                type: string
                example: '12'
              expectedQuantity:
                type: integer
                minimum: 1
                example: 4
              order:
                type: integer
                minimum: 0
                example: 1
      example:
        version: '1.1'
        items:
          - instrumentId: '12'
            expectedQuantity: 4
            order: 1
          - instrumentId: '15'
            expectedQuantity: 2
            order: 2

    # ── Checagem (RF05–RF09) ──
    CheckStatus:
      type: string
      enum: [em_andamento, finalizada, cancelada]
      example: em_andamento

    CheckItemStatus:
      type: string
      enum: [pendente, confirmado, pulado, divergente]
      example: pendente

    ConfirmationMethod:
      type: string
      enum: [voz, toque]
      description: Como o item foi marcado (RNF02 — toque como alternativa à voz).

    CheckStartInput:
      type: object
      required: [surgeryId]
      properties:
        surgeryId:
          type: string
          example: joelho
        room:
          type: string
          maxLength: 40
          example: Sala 3
        notes:
          type: string
          maxLength: 500

    CheckItem:
      type: object
      required: [id, checklistItemId, instrumentId, name, expectedQuantity, status]
      properties:
        id:
          type: string
          example: '7'
        checklistItemId:
          type: string
          example: '31'
        instrumentId:
          type: string
          example: '12'
        name:
          type: string
          example: Pinça Kelly reta 14cm
        unit:
          type: string
          example: unid
        category:
          $ref: '#/components/schemas/InstrumentCategory'
        critical:
          type: boolean
          example: true
        order:
          type: integer
          example: 1
        expectedQuantity:
          type: integer
          minimum: 1
          example: 4
        foundQuantity:
          type: integer
          minimum: 0
          nullable: true
          example: 4
        status:
          $ref: '#/components/schemas/CheckItemStatus'
        method:
          type: string
          enum: [voz, toque]
          nullable: true
          description: Como o item foi marcado (RNF02 — toque como alternativa à voz).
        transcript:
          type: string
          nullable: true
          description: Texto reconhecido por voz que gerou a marcação.
          example: confirmar pinça kelly
        recordedAt:
          type: string
          format: date-time
          nullable: true
        recordedBy:
          type: string
          nullable: true
          example: Ana Silva

    CheckItemUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmado, pulado, divergente, pendente]
        foundQuantity:
          type: integer
          minimum: 0
          description: Quantidade encontrada. Obrigatória quando `status = divergente`. Em `confirmado`, se omitida assume a esperada; se diferente da esperada, aplica-se a RN07.
        method:
          $ref: '#/components/schemas/ConfirmationMethod'
        transcript:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 500

    DivergenceType:
      type: string
      enum: [faltante, excedente, outro]
    Divergence:
      type: object
      required: [id, checkId, type, automatic, recordedAt]
      properties:
        id:
          type: string
          example: '3'
        checkId:
          type: string
          example: '42'
        checkItemId:
          type: string
          nullable: true
          example: '7'
        instrumentId:
          type: string
          nullable: true
          example: '12'
        description:
          type: string
          nullable: true
          description: Nome do item quando não cadastrado.
          example: Pinça Kelly reta 14cm
        type:
          $ref: '#/components/schemas/DivergenceType'
        expectedQuantity:
          type: integer
          nullable: true
          example: 4
        foundQuantity:
          type: integer
          nullable: true
          example: 3
        notes:
          type: string
          nullable: true
        automatic:
          type: boolean
          description: true quando gerada automaticamente a partir de item divergente (RN04).
          example: true
        recordedAt:
          type: string
          format: date-time
        recordedBy:
          type: string
          nullable: true
          example: Ana Silva

    DivergenceInput:
      type: object
      required: [type]
      description: Informe ao menos um entre `instrumentId` e `description`.
      properties:
        type:
          $ref: '#/components/schemas/DivergenceType'
        instrumentId:
          type: string
        description:
          type: string
          maxLength: 120
        expectedQuantity:
          type: integer
          minimum: 0
        foundQuantity:
          type: integer
          minimum: 0
        notes:
          type: string
          maxLength: 500

    CheckProgress:
      type: object
      required: [total, pending, confirmed, skipped, divergent]
      properties:
        total:
          type: integer
          example: 12
        pending:
          type: integer
          example: 3
        confirmed:
          type: integer
          example: 8
        skipped:
          type: integer
          example: 0
        divergent:
          type: integer
          example: 1

    CheckSummary:
      type: object
      required: [id, surgeryId, surgeryName, checklistVersion, operator, status, startedAt, progress]
      properties:
        id:
          type: string
          example: '42'
        surgeryId:
          type: string
          example: joelho
        surgeryName:
          type: string
          example: Artroplastia de Joelho
        checklistVersion:
          type: string
          example: '1.0'
        operatorId:
          type: string
          example: u1
        operator:
          type: string
          example: Ana Silva
        status:
          $ref: '#/components/schemas/CheckStatus'
        room:
          type: string
          nullable: true
          example: Sala 3
        startedAt:
          type: string
          format: date-time
          example: '2026-11-10T07:42:10-04:00'
        finishedAt:
          type: string
          format: date-time
          nullable: true
        reportId:
          type: string
          nullable: true
          description: Relatório gerado na finalização.
        progress:
          $ref: '#/components/schemas/CheckProgress'

    Check:
      allOf:
        - $ref: '#/components/schemas/CheckSummary'
        - type: object
          required: [items, divergences]
          properties:
            notes:
              type: string
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/CheckItem'
            divergences:
              type: array
              items:
                $ref: '#/components/schemas/Divergence'

    # ── Relatórios (RF10) ──
    ReportItem:
      type: object
      required: [id, name, quantity, unit, category, critical, status]
      properties:
        id:
          type: string
          example: '12'
        name:
          type: string
          example: Pinça Kelly reta 14cm
        quantity:
          type: integer
          example: 4
        unit:
          type: string
          example: unid
        category:
          type: string
          example: Instrumental
        critical:
          type: boolean
          example: true
        status:
          type: string
          enum: [confirmed, skipped, missing, pending]
          description: 'Situação do item no relatório. Mapeamento com `item_checagem.status`: `confirmed` = confirmado; `skipped` = pulado (não conferido, sem divergência); `missing` = divergente; `pending` = pendente (nunca ocorre em relatório finalizado, RN01).'
        confirmedAt:
          type: string
          description: Horário da confirmação (HH:mm:ss).
          example: '07:45:12'

    ReportCreateRequest:
      type: object
      required: [checkId]
      description: Pedido do relatório de uma checagem finalizada. O servidor recalcula tudo; o cliente envia só o `checkId`.
      properties:
        checkId:
          type: string
          example: '42'
    ChecklistReport:
      type: object
      description: Relatório de conferência gerado pelo servidor ao finalizar a checagem (tabela `relatorio_conferencia`). É imutável (RN03). `total = confirmed + skipped + missing`.
      required: [id, checkId, surgeryId, surgeryName, specialty, operator, operatorRole, date, time, duration, confirmed, skipped, missing, total, status, items]
      properties:
        id:
          type: string
          example: r1
        checkId:
          type: string
          description: Checagem que originou o relatório (`relatorio_conferencia.checagem_id`).
          example: '42'
        checklistVersion:
          type: string
          description: Versão do checklist padrão usada.
          example: '1.0'
        surgeryId:
          type: string
          example: joelho
        surgeryName:
          type: string
          example: Artroplastia de Joelho
        specialty:
          type: string
          example: Ortopedia
        operator:
          type: string
          example: Ana Silva
        operatorRole:
          $ref: '#/components/schemas/UserRole'
        date:
          type: string
          description: dd/MM/yyyy
          example: 10/11/2026
        time:
          type: string
          description: HH:mm
          example: 07:42
        duration:
          type: string
          example: 6min 32s
        confirmed:
          type: integer
          minimum: 0
          description: Itens confirmados.
          example: 10
        skipped:
          type: integer
          minimum: 0
          description: 'Itens pulados (`pulados`): não conferidos, sem divergência.'
          example: 1
        missing:
          type: integer
          minimum: 0
          description: Itens divergentes (`divergentes`).
          example: 1
        total:
          type: integer
          minimum: 0
          example: 12
        divergences:
          type: integer
          minimum: 0
          description: Total de registros de divergência, incluindo excedentes (`divergencias`).
          example: 2
        status:
          type: string
          example: divergencia
          description: '`divergencia` quando há ao menos uma divergência; senão `ok`.'
          enum: [ok, divergencia]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
        divergenceDetails:
          type: array
          description: Divergências registradas (RN04), com faltantes e excedentes.
          items:
            $ref: '#/components/schemas/Divergence'
    StockStatus:
      type: string
      enum: [ok, low, critical]
      description: 'low = abaixo do mínimo; critical = abaixo da metade do mínimo.'

    StockItem:
      type: object
      required: [id, name, available, minimum, unit, category, status, lastUpdated, updatedBy]
      properties:
        id:
          type: string
          example: st1
        instrumentId:
          type: string
          readOnly: true
          description: Instrumental ao qual o saldo pertence (`estoque_item.instrumental_id`, um saldo por instrumental).
          example: '12'
        name:
          type: string
          example: Luva cirúrgica estéril 7,5
        available:
          type: integer
          minimum: 0
          example: 40
        minimum:
          type: integer
          minimum: 0
          example: 50
        unit:
          type: string
          example: par
        category: &id001
          $ref: '#/components/schemas/InstrumentCategory'
        status:
          $ref: '#/components/schemas/StockStatus'
        lastUpdated:
          type: string
          example: 10/11/2026 07:30
        updatedBy:
          type: string
          example: Administrador

    StockInput:
      type: object
      required: [name, available, minimum, unit, category]
      properties:
        name:
          type: string
          maxLength: 120
          example: Luva cirúrgica estéril 7,5
        available:
          type: integer
          minimum: 0
          example: 40
        minimum:
          type: integer
          minimum: 0
          example: 50
        unit:
          type: string
          maxLength: 20
          example: par
        category: *id001
        instrumentId:
          type: string
          description: Opcional. Vincula o saldo a um instrumental já cadastrado; se omitido, o backend cadastra o instrumental com `name`, `unit` e `category`.
          example: '12'
    StockAdjustment:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Positivo para entrada, negativo para saída; diferente de zero.
          example: -2
        reason:
          type: string
          maxLength: 200
